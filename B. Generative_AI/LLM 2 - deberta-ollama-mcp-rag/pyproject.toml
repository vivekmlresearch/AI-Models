[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-classification-finetuning"
version = "0.1.0"
description = "Starter baseline for Kaggle LLM preference classification"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
