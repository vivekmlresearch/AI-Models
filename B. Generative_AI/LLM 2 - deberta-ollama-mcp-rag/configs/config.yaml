paths:
  train_csv: src/data/raw/train.csv
  test_csv: src/data/raw/test.csv
  sample_submission_csv: src/data/raw/sample_submission.csv
  model_dir: artifacts/deberta_v3_base
  submission_csv: artifacts/submission.csv

model:
  pretrained_model_name: microsoft/deberta-v3-base
  max_length: 128
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.0
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  valid_size: 0.1
  random_state: 42
  fp16: false