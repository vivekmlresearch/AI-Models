services:
  app:
    image: llm-mcp-rag-assistant:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma:/app/.chroma
    depends_on:
      - ollama
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  mcp-server:
    image: llm-mcp-rag-assistant:latest
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./chroma:/app/.chroma
    depends_on:
      - ollama
    command: ["python", "-m", "src.mcp_server.server"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data: